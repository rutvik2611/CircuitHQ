# CircuitHQ — Prometheus Configuration
# ======================================
# See: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval:     30s
  evaluation_interval: 30s
  scrape_timeout:      10s

# Alerting rules
rule_files:
  - "/etc/prometheus/rules/host.yml"
  - "/etc/prometheus/rules/container.yml"
  - "/etc/prometheus/rules/traefik.yml"
  - "/etc/prometheus/rules/backup.yml"
  - "/etc/prometheus/rules/certificate.yml"

# Alertmanager endpoint
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Scrape targets
scrape_configs:

  # ── Prometheus itself ───────────────────────────────────────────────
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus

  # ── Node Exporter (Host Metrics) ────────────────────────────────────
  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host_type: physical
          instance: circuithq-host

  # ── cAdvisor (Container Metrics) ────────────────────────────────────
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          instance: circuithq-host

  # ── Traefik ─────────────────────────────────────────────────────────
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets:
          - traefik:8080
        labels:
          service: traefik

  # ── Alertmanager ────────────────────────────────────────────────────
  - job_name: alertmanager
    metrics_path: /metrics
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: alertmanager

  # ── Blackbox Exporter (HTTP probes) ─────────────────────────────────
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://traefik.m3.dev.rutvik2611.com/health
          - https://grafana.m3.dev.rutvik2611.com/api/health
          - https://auth.m3.dev.rutvik2611.com/api/health
          - https://status.m3.dev.rutvik2611.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Blackbox Exporter (ICMP ping) ──────────────────────────────────
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 1.1.1.1          # Cloudflare DNS (internet connectivity)
          - 8.8.8.8          # Google DNS (internet fallback)
          - 100.100.100.100  # Tailscale DERP (mesh health)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Docker Engine Metrics (if enabled) ──────────────────────────────
  # - job_name: docker
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets:
  #         - host.docker.internal:9323
  #       labels:
  #         service: docker-engine