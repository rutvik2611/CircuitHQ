# CircuitHQ — Alertmanager Configuration
# ========================================
# See: https://prometheus.io/docs/alerting/latest/configuration/
#
# Receivers are commented out until Slack/email is configured.
# Alerts are still visible in the Alertmanager UI and Prometheus.

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'

  routes:
    - receiver: 'null'
      match:
        severity: warning

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

templates:
  - '/etc/alertmanager/*.tmpl'

receivers:
  - name: 'null'