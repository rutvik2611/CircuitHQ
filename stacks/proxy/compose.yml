# CircuitHQ — Traefik Reverse Proxy Stack
# ==========================================
# Ingress gateway for all public and private web services.
# Dashboard accessible only via Tailscale / management network.
# ACME (Let's Encrypt) certificates stored in shared traefik-acme volume.

services:
  traefik:
    image: traefik:v3.3
    container_name: circuithq-traefik
    restart: unless-stopped

    networks:
      - circuithq-proxy
      - circuithq-monitoring
      - circuithq-security

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host

    volumes:
      # Static and dynamic configuration
      - type: bind
        source: ./traefik/static.yml
        target: /etc/traefik/traefik.yml
        read_only: true

      - type: bind
        source: ./traefik/dynamic
        target: /etc/traefik/dynamic
        read_only: true

      # Docker socket for service discovery
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

      # ACME certificate storage
      - type: volume
        source: traefik-acme
        target: /etc/traefik/acme

    labels:
      # Enable Traefik itself as a routed service (dashboard)
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.m3.dev.rutvik2611.com`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@file"
      - "traefik.http.routers.dashboard.entrypoints=web"

      # API metrics scraping port (internal monitoring only)
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
      - "prometheus.path=/metrics"

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  circuithq-proxy:
    name: circuithq-proxy
    external: true

  circuithq-monitoring:
    name: circuithq-monitoring
    external: true

  circuithq-security:
    name: circuithq-security
    external: true

volumes:
  traefik-acme:
    name: circuithq-traefik-acme
    external: true