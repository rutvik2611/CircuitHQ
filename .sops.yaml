# CircuitHQ — SOPS Configuration
# ===============================
# See: https://github.com/getsops/sops
#
# To use: replace AGE_PLACEHOLDER with your actual age public key
# (generated by: age-keygen -o ~/.config/sops/age/keys.txt)
#
# The age public key is the line starting with "age1..." in keys.txt.
# NEVER commit the private key (keys.txt).

creation_rules:

  # Production secrets
  - path_regex: secrets/production/.*\.sops\.yaml
    age: AGE_PLACEHOLDER_AGE_PUBLIC_KEY    # TODO: replace with real age public key
    encrypted_regex: "^(password|key|token|secret|api_key|private_key|credential)$"

  # Staging secrets
  - path_regex: secrets/staging/.*\.sops\.yaml
    age: AGE_PLACEHOLDER_AGE_PUBLIC_KEY    # TODO: replace with real age public key
    encrypted_regex: "^(password|key|token|secret|api_key|private_key|credential)$"