# Restic Backup Secrets — SOPS Encrypted
# ========================================
# Encrypt with:  sops --encrypt --in-place secrets/production/restic.sops.yaml
# Decrypt with:  sops --decrypt secrets/production/restic.sops.yaml
#
# These variables are sourced by backup.sh at runtime.
# The rendered .env file is created by render-secrets.sh with 0600 permissions.

# RESTIC_REPOSITORY: ""
# Example values:
#   s3:s3.amazonaws.com/circuithq-backups
#   sftp:user@backup-server:/backups/circuithq
#   /mnt/backup/circuithq
#   rclone:remote:circuithq-backups

# RESTIC_PASSWORD: ""
# Minimum 16 characters. Store securely — this is the master key.

# AWS_ACCESS_KEY_ID: ""
# AWS_SECRET_ACCESS_KEY: ""

# UPTIME_KUMA_PUSH_URL: ""
# Push URL from Uptime Kuma monitor for backup success/failure notification

# Metadata (not encrypted)
purpose: "Restic backup repository credentials and configuration"