# CircuitHQ — Laptop Deploy Workflow
# =====================================
# Deploys CircuitHQ stacks to the M3 Mac laptop (production deployment target).
# Requires:
#   1. `docs/approvals/laptop-cicd-retarget-approved.md` to exist and be approved
#   2. Manual (`workflow_dispatch`) trigger — NEVER runs automatically
#   3. Typed confirmation `I_APPROVE_LAPTOP_DEPLOY`
#   4. Runs only on the self-hosted M3 Mac runner
#
# Steps: 1) Check approval gate, 2) Preflight, 3) Backup, 4) Deploy, 5) Health check

name: deploy-laptop

on:
  workflow_dispatch:
    inputs:
      stacks:
        description: 'Stacks to deploy (comma-separated, or "all")'
        required: true
        default: 'proxy,auth,monitoring,logging'
        type: string
      skip_backup:
        description: 'Skip pre-deploy backup'
        required: false
        default: false
        type: boolean
      confirm:
        description: 'Type "I_APPROVE_LAPTOP_DEPLOY" to confirm'
        required: true
        default: ''
        type: string

env:
  DEPLOY_TARGET: localhost
  PROJECT_DIR: ${{ vars.PROJECT_DIR || '/Users/rutvik2611/Projects/CircuitHQ' }}

jobs:
  deploy:
    name: Deploy to Laptop (production)
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'self-hosted' }}
    environment: laptop-production
    if: github.event.inputs.confirm == 'I_APPROVE_LAPTOP_DEPLOY'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check approval gate
        run: |
          GATE="docs/approvals/laptop-cicd-retarget-approved.md"
          if [ ! -f "$GATE" ]; then
            echo "❌ Approval gate not found: $GATE"
            echo "   Create this file and complete all pre-approval checks before deploying to laptop."
            exit 1
          fi
          if ! grep -q "Status:\s*Approved" "$GATE"; then
            echo "❌ Approval gate exists but is not in 'Approved' status."
            echo "   Set Status: Approved in $GATE before deploying."
            exit 1
          fi
          echo "✅ Approval gate passed — laptop deploy authorized"
        shell: bash

      - name: Preflight checks
        run: |
          if [ -f scripts/deploy/preflight.sh ]; then
            bash scripts/deploy/preflight.sh
          else
            echo "⚠️  preflight.sh not found — skipping"
          fi
        shell: bash

      - name: Run pre-deploy backup
        if: ${{ !github.event.inputs.skip_backup }}
        run: |
          echo "📦 Running pre-deploy backup..."
          if [ -f .secrets-rendered/production/restic.env ]; then
            if ! RESTIC_ENV=.secrets-rendered/production/restic.env bash scripts/backup/backup.sh; then
              echo "⚠️  Backup failed — continuing with deploy"
            fi
          else
            echo "⚠️  restic.env not found — skipping backup"
          fi
        shell: bash

      - name: Render secrets
        run: |
          echo "🔐 Rendering secrets..."
          if [ -f scripts/deploy/render-secrets.sh ]; then
            bash scripts/deploy/render-secrets.sh || { echo "⚠️  Secret render failed"; exit 1; }
          fi
        shell: bash

      - name: Deploy stacks
        run: |
          STACKS="${{ github.event.inputs.stacks }}"
          if [ "$STACKS" = "all" ]; then
            STACKS="proxy,auth,monitoring,logging"
          fi
          IFS=',' read -ra STACK_LIST <<< "$STACKS"
          for stack in "${STACK_LIST[@]}"; do
            echo "🚀 Deploying stack: $stack"
            if [ -d "stacks/$stack" ]; then
              docker compose -f "stacks/$stack/compose.yml" pull
              docker compose -f "stacks/$stack/compose.yml" up -d
            else
              echo "  ❌ Stack not found: stacks/$stack"
              exit 1
            fi
          done
        shell: bash

      - name: Health check
        run: |
          if [ -f scripts/deploy/healthcheck.sh ]; then
            bash scripts/deploy/healthcheck.sh
          else
            echo "   Checking core services..."
            FAILED=0
            for container in circuithq-traefik circuithq-authelia circuithq-prometheus circuithq-grafana; do
              if docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null; then
                echo "  ✅ $container"
              else
                echo "  ❌ $container not running"
                FAILED=1
              fi
            done
            [ "$FAILED" = "0" ] || { echo "❌ Health check failed"; exit 1; }
          fi
        shell: bash

      - name: Traffic verification
        run: |
          if [ -f scripts/deploy/verify-traffic.sh ]; then
            bash scripts/deploy/verify-traffic.sh || { echo "❌ Traffic verification failed"; exit 1; }
          fi
        shell: bash

      - name: Display deployment summary
        run: |
          echo "## ✅ Laptop Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: laptop-production" >> $GITHUB_STEP_SUMMARY
          echo "- Stacks: ${{ github.event.inputs.stacks }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY